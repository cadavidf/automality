description = "Self-test every automality hook (catches a hook gone silently dark, like the delegate-gate outage)"
prompt = "Run `node \"${CLAUDE_PLUGIN_ROOT}/hooks/automality-doctor.js\"` via Bash and print its output verbatim (or a well-formatted rendering of the same PASS/FAIL lines and the trailing pass/fail count) -- do not reinterpret, summarize away, or second-guess an individual PASS/FAIL: the script's assertions are the source of truth, not model judgment. If any line reads FAIL, say so plainly and surface the detail after the em dash so it's actionable, then note this means a hook is not enforcing its rule right now. If everything passes, a short one-line confirmation is enough -- don't pad it out. Report only, change nothing."

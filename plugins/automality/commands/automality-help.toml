description = "Quick reference for automality levels, skills, and commands"
prompt = "Show the automality quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /automality lite (build what's asked, name the lazier alternative in one line), /automality (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /automality ultra (deletion before addition, challenges the requirement before building). Commands: /automality-review (over-engineering review of the current changes), /automality-audit (whole-repo over-engineering audit), /automality-debt (harvest automality: comments into a tracked ledger), /automality-gain (measured-impact scoreboard from the benchmark), /automality-help (this card). Deactivate with 'stop automality', 'normal mode', or /automality off; resume anytime with /automality. Default mode is full; change it with the AUTOMALITY_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/automality/config.json (Windows: %APPDATA%\\automality\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."

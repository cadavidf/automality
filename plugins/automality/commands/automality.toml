description = "Switch automality intensity level (lite/full/ultra/off)"
prompt = "Switch to automality {{args}} mode. If no level specified, use full. Minimal-first mode, before any code: does it need to exist at all (YAGNI)? Does the standard library do it? A native platform feature? Can it be one line? Build the minimum that works. No unrequested abstractions, no avoidable dependencies, no boilerplate. Mark intentional simplifications with a automality: comment."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Automality">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- mark: descending rungs — the ladder, cut down each step -->
  <g fill="url(#g)">
    <rect x="0"  y="20" width="88" height="14" rx="7"/>
    <rect x="0"  y="53" width="60" height="14" rx="7"/>
    <rect x="0"  y="86" width="32" height="14" rx="7"/>
  </g>
  <!-- wordmark -->
  <text x="112" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1" fill="url(#g)">automality</text>
</svg>
